name: iOS Integration Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  ios:
    # iOS 18 runs on macOS 15 (Xcode 16), and iOS 26 on macOS 26 (Xcode 26)
    runs-on: macos-${{ matrix.ios-version == 18 && 15 || 26 }}
    timeout-minutes: 60
    strategy:
      matrix:
        ios-version: [18, 26]
        package_manager: [cocoapods, swiftpm]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Boot iOS simulator
        uses: futureware-tech/simulator-action@v6
        with:
          os: iOS
          os_version: ^${{ matrix.ios-version }}
          wait_for_boot: true
          erase_before_boot: true

      - name: Grant permission
        run: |
          brew tap wix/brew
          # Homebrew 6.0 requires explicit trust for third-party taps
          brew trust wix/brew
          brew install applesimutils coreutils
          cd example
          applesimutils --booted --bundle studio.midoridesign.galExample --setPermissions photos=YES

      - name: Set Package Manager Configuration
        run: |
          if [ "${{ matrix.package_manager }}" == "cocoapods" ]; then
            flutter config --no-enable-swift-package-manager
          else
            flutter config --enable-swift-package-manager
          fi

      # On a freshly booted iOS 26 simulator, Flutter never sees the VM Service line of the first app launch,
      # and the first attempt hangs until it times out. Launching an app and streaming the logs once avoids it.
      - name: Warm up simulator
        run: |
          xcrun simctl launch booted com.apple.Preferences
          gtimeout 30 xcrun simctl spawn booted log stream > /dev/null || true
          xcrun simctl terminate booted com.apple.Preferences || true

      # gtimeout stops an attempt that hangs, and the next one runs on the same simulator.
      # --no-uninstall keeps the photos permission for the next attempt.
      - name: Run integration tests
        run: |
          cd example
          for i in 1 2 3; do
            gtimeout -s INT -k 1m 10m flutter test --no-uninstall integration_test/integration_test.dart && exit 0
            xcrun simctl terminate booted studio.midoridesign.galExample || true
          done
          exit 1

      - name: Validate Podspec in CocoaPods
        if: matrix.package_manager == 'cocoapods'
        run: |
          pod lib lint darwin/gal.podspec --configuration=Debug --skip-tests --use-modular-headers --use-libraries
          pod lib lint darwin/gal.podspec --configuration=Debug --skip-tests --use-modular-headers
