name: iOS Integration Tests

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  ios:
    # iOS 18 runs on macOS 15 (Xcode 16), and iOS 26 on macOS 26 (Xcode 26)
    runs-on: macos-${{ matrix.ios-version == 18 && 15 || 26 }}
    timeout-minutes: 60
    strategy:
      matrix:
        ios-version: [18, 26]
        package_manager: [cocoapods, swiftpm]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable
          cache: true

      # `flutter test` can launch the app before its simulator log reader is ready, miss the VM Service URL,
      # and wait until it times out (flutter/flutter#181771). Until the fix (flutter/flutter#193142) reaches stable,
      # apply it to the Flutter tool. The check skips it once stable has the fix.
      - name: Patch the Flutter tool
        run: |
          cd "$FLUTTER_ROOT"
          if ! grep -q '_ready' packages/flutter_tools/lib/src/ios/simulators.dart; then
            curl -sfL https://github.com/flutter/flutter/commit/c3ed85ef987759ee54a6bce275490cde2a238dc1.diff | git apply --include='packages/flutter_tools/lib/*'
            rm -f bin/cache/flutter_tools.stamp
          fi
          flutter --version

      # Boot the first available simulator of an iOS runtime with the major version of the matrix,
      # in the order simctl lists them, as futureware-tech/simulator-action did.
      # bootstatus waits until it has booted. If that takes over 6 minutes, boot it again, up to 3 times.
      - name: Boot iOS simulator
        env:
          IOS_VERSION: ${{ matrix.ios-version }}
        run: |
          device=$(xcrun simctl list --json devices available | jq -r --arg major "$IOS_VERSION" '
            first(.devices | to_entries[]
              | select(.key | test("^com\\.apple\\.CoreSimulator\\.SimRuntime\\.iOS-\($major)(-|$)"))
              | (.key | ltrimstr("com.apple.CoreSimulator.SimRuntime.iOS-") | gsub("-"; ".")) as $version
              | .value[] | "\(.udid) \(.state) \($version) \(.name)") // empty')
          if [ -z "$device" ]; then
            echo "::error::No available simulator of iOS $IOS_VERSION"
            xcrun simctl list runtimes
            exit 1
          fi
          read -r udid state version name <<< "$device"
          echo "Picked a device: $name (iOS $version) [$udid] - $state"
          [ "$state" = Shutdown ] || xcrun simctl shutdown "$udid"
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          for attempt in 1 2 3 4; do
            perl -e 'alarm shift; exec @ARGV' 360 xcrun simctl bootstatus "$udid" && exit 0
            echo "::warning::bootstatus attempt $attempt/4 failed"
            [ "$attempt" -lt 4 ] || exit 1
            xcrun simctl shutdown "$udid" || true
            xcrun simctl boot "$udid"
          done

      # simctl writes the photos permission with auth_version 1, which PhotoKit reads as not granted.
      # Version 2 is the format since iOS 14, where the permission can also be limited.
      - name: Grant permission
        run: |
          xcrun simctl privacy booted grant photos studio.midoridesign.galExample
          sqlite3 "$(xcrun simctl getenv booted HOME)/Library/TCC/TCC.db" \
            "UPDATE access SET auth_version = 2 WHERE service = 'kTCCServicePhotos'"

      - name: Set Package Manager Configuration
        run: |
          if [ "${{ matrix.package_manager }}" == "cocoapods" ]; then
            flutter config --no-enable-swift-package-manager
          else
            flutter config --enable-swift-package-manager
          fi

      # gtimeout stops an attempt that hangs, and the next one runs on the same simulator.
      # Retries also cover short network failures, such as a socket error from pub.dev.
      # --no-uninstall keeps the photos permission for the next attempt.
      - name: Run integration tests
        run: |
          brew install coreutils
          cd example
          for i in 1 2 3; do
            gtimeout -s INT -k 1m 10m flutter test --no-uninstall integration_test/integration_test.dart && exit 0
            xcrun simctl terminate booted studio.midoridesign.galExample || true
          done
          exit 1

      - name: Validate Podspec in CocoaPods
        if: matrix.package_manager == 'cocoapods'
        run: |
          pod lib lint darwin/gal.podspec --configuration=Debug --skip-tests --use-modular-headers --use-libraries
          pod lib lint darwin/gal.podspec --configuration=Debug --skip-tests --use-modular-headers
