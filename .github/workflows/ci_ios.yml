name: iOS Integration Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  ios:
    # iOS 18 runs on macOS 15 (Xcode 16), and iOS 26 on macOS 26 (Xcode 26)
    runs-on: macos-${{ matrix.ios-version == 18 && 15 || 26 }}
    timeout-minutes: 60
    strategy:
      matrix:
        ios-version: [18, 26]
        package_manager: [cocoapods, swiftpm]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Boot iOS simulator
        uses: futureware-tech/simulator-action@v6
        with:
          os: iOS
          os_version: ^${{ matrix.ios-version }}
          wait_for_boot: true
          erase_before_boot: true

      - name: Grant permission
        run: |
          brew tap wix/brew
          # Homebrew 6.0 requires explicit trust for third-party taps
          brew trust wix/brew
          brew install applesimutils coreutils
          cd example
          applesimutils --booted --bundle studio.midoridesign.galExample --setPermissions photos=YES

      - name: Set Package Manager Configuration
        run: |
          if [ "${{ matrix.package_manager }}" == "cocoapods" ]; then
            flutter config --no-enable-swift-package-manager
          else
            flutter config --enable-swift-package-manager
          fi

      # `flutter test` sometimes launches the app before its simulator log reader is ready, misses the VM Service URL,
      # and waits until it times out (flutter/flutter#181771, fixed on master but not yet on beta).
      # Launching the app once beforehand makes it much rarer.
      - name: Launch the app once
        run: |
          cd example
          flutter build ios --simulator --debug -t integration_test/integration_test.dart
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app
          xcrun simctl launch booted studio.midoridesign.galExample
          sleep 20
          xcrun simctl terminate booted studio.midoridesign.galExample || true

      # gtimeout stops an attempt that hangs (a healthy one takes up to 4 minutes), and the next one runs on the same simulator.
      # --no-uninstall keeps the photos permission for the next attempt.
      - name: Run integration tests
        run: |
          cd example
          for i in 1 2 3; do
            gtimeout -s INT -k 1m 6m flutter test --no-uninstall integration_test/integration_test.dart && exit 0
            xcrun simctl terminate booted studio.midoridesign.galExample || true
          done
          exit 1

      - name: Validate Podspec in CocoaPods
        if: matrix.package_manager == 'cocoapods'
        run: |
          pod lib lint darwin/gal.podspec --configuration=Debug --skip-tests --use-modular-headers --use-libraries
          pod lib lint darwin/gal.podspec --configuration=Debug --skip-tests --use-modular-headers
