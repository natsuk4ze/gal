name: Windows Integration Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-${{ matrix.windows-version }}
    timeout-minutes: 30
    strategy:
      matrix:
        # Windows Server 2022 is built on Windows 10 21H2, and 2025 on Windows 11 24H2
        windows-version: [2022, 2025]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run integration tests
        id: Run-integration-tests
        timeout-minutes: 15
        run: |
          cd example
          flutter test integration_test/integration_test.dart windows
