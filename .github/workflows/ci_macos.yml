name: macOS Integration Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-${{ matrix.macos-version }}
    timeout-minutes: 30
    strategy:
      matrix:
        # macos-14 is deprecated and about to be retired
        macos-version: [15, 26]
        package_manager: [cocoapods, swiftpm]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Set Package Manager Configuration
        run: |
          if [ "${{ matrix.package_manager }}" == "cocoapods" ]; then
            flutter config --no-enable-swift-package-manager
          else
            flutter config --enable-swift-package-manager
          fi

      # The runners cannot answer the dialog asking for access to the photo library, so allow it beforehand.
      # TCC checks the process responsible for the app, which is the agent running the job.
      - name: Allow access to the photo library
        run: |
          agent=$(sudo launchctl procinfo $$ | sed -n 's/^[[:space:]]*responsible path = //p')
          for service in kTCCServicePhotos kTCCServicePhotosAdd; do
            sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('$service', '$agent', 1, 2, 3, 1)"
          done

      - name: Run integration tests
        id: Run-integration-tests
        timeout-minutes: 15
        run: |
          cd example
          flutter test -d macos integration_test/integration_test.dart macos

      - name: Validate Podspec in CocoaPods
        if: matrix.package_manager == 'cocoapods'
        run: |
          pod lib lint darwin/gal.podspec --configuration=Debug --skip-tests --use-modular-headers --use-libraries
          pod lib lint darwin/gal.podspec --configuration=Debug --skip-tests --use-modular-headers
