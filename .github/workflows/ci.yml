# Runner details on https://github.com/actions/runner-images/tree/main/images
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_all:
        type: boolean
        description: "Run all jobs regardless of path filters"
        required: false
        default: false
      run_windows:
        type: boolean
        description: "Run Windows tests"
        required: false
        default: false
      run_macos:
        type: boolean
        description: "Run macOS tests"
        required: false
        default: false
      run_ios:
        type: boolean
        description: "Run iOS tests"
        required: false
        default: false
      run_android:
        type: boolean
        description: "Run Android tests"
        required: false
        default: false
  workflow_call:
    inputs:
      run_all:
        type: boolean
        description: "Run all jobs regardless of path filters"
        required: false
        default: false
      run_windows:
        type: boolean
        description: "Run Windows tests"
        required: false
        default: false
      run_macos:
        type: boolean
        description: "Run macOS tests"
        required: false
        default: false
      run_ios:
        type: boolean
        description: "Run iOS tests"
        required: false
        default: false
      run_android:
        type: boolean
        description: "Run Android tests"
        required: false
        default: false

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      common_changed: ${{ steps.filter.outputs.common }}
      windows_changed: ${{ steps.filter.outputs.windows }}
      macos_changed: ${{ steps.filter.outputs.macos }}
      ios_changed: ${{ steps.filter.outputs.ios }}
      android_changed: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit, whose first parent is the base branch
          fetch-depth: 2

      # Compares the same commits as dorny/paths-filter did:
      # - pull_request: the changes of the pull request
      # - push to a branch: the changes since the commit before the push
      # - other runs, such as workflow_dispatch or the tag push of publish.yml:
      #   the changes since the commit where HEAD left the default branch
      # Every filter is true when there is no commit to compare with, as for the first push
      # or a workflow_dispatch on the default branch, or when that commit cannot be fetched.
      - name: Filter changes
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          merge_base() {
            local refs=("$GITHUB_SHA" "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH")
            git fetch --no-tags --depth=100 origin "${refs[@]}" || return
            git merge-base "origin/$DEFAULT_BRANCH" HEAD && return
            git fetch --no-tags --unshallow origin "${refs[@]}" || return
            git merge-base "origin/$DEFAULT_BRANCH" HEAD
          }
          base=
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=HEAD^1
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" && base=$BEFORE
          elif [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            base=$(merge_base) || base=
          fi
          if [ -z "$base" ]; then
            echo "No commit to compare with, so every filter is true"
          else
            echo "Changes from $base:"
            git diff --no-renames --name-status "$base" HEAD
          fi

          # Prints whether a file matching one of the patterns changed. Each pattern gets the
          # glob magic, where * does not match / and **/ matches any folders, including none.
          changed() {
            if [ -z "$base" ] || ! git diff --quiet --no-renames "$base" HEAD -- "${@/#/:(glob)}"; then
              echo true
            else
              echo false
            fi
          }
          {
            echo "common=$(changed '**/lib/**/*.dart' '**/pubspec.yaml' '**/pubspec.lock' 'example/integration_test/**' 'example/assets/**')"
            echo "windows=$(changed '**/windows/**' '**/ci_windows.yml')"
            echo "macos=$(changed 'darwin/**' 'example/macos/**' '**/ci_macos.yml')"
            echo "ios=$(changed 'darwin/**' 'example/ios/**' '**/ci_ios.yml')"
            echo "android=$(changed '**/android/**' '**/ci_android.yml')"
          } | tee -a "$GITHUB_OUTPUT"

  windows:
    needs: filter
    if: ${{ needs.filter.outputs.windows_changed == 'true' || needs.filter.outputs.common_changed == 'true' || inputs.run_all || inputs.run_windows }}
    uses: ./.github/workflows/ci_windows.yml

  macos:
    needs: filter
    if: ${{ needs.filter.outputs.macos_changed == 'true' || needs.filter.outputs.common_changed == 'true' || inputs.run_all || inputs.run_macos }}
    uses: ./.github/workflows/ci_macos.yml

  ios:
    needs: filter
    if: ${{ needs.filter.outputs.ios_changed == 'true' || needs.filter.outputs.common_changed == 'true' || inputs.run_all || inputs.run_ios }}
    uses: ./.github/workflows/ci_ios.yml

  android:
    needs: filter
    if: ${{ needs.filter.outputs.android_changed == 'true' || needs.filter.outputs.common_changed == 'true' || inputs.run_all || inputs.run_android }}
    uses: ./.github/workflows/ci_android.yml

  # Unit tests and static checks are fast, so they run on every change
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Run unit tests
        run: flutter test --coverage

      - name: Check that unit tests cover every line
        run: |
          for f in $(find lib/src -name '*.dart'); do grep -qxF "SF:$f" coverage/lcov.info || { echo "$f: not loaded by any test"; exit 1; }; done
          awk -F'[:,]' '/^SF:/{f=$2} /^DA:/ && $3==0 {print f ":" $2; bad=1} END{exit bad}' coverage/lcov.info

      - name: Test dart fix
        working-directory: test_fixes
        run: dart fix --compare-to-golden
