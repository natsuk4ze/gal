# Runner details on https://github.com/actions/runner-images/tree/main/images
name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_all:
        type: boolean
        description: Run every platform
      run_windows:
        type: boolean
        description: Run Windows tests
      run_macos:
        type: boolean
        description: Run macOS tests
      run_ios:
        type: boolean
        description: Run iOS tests
      run_android:
        type: boolean
        description: Run Android tests
  workflow_call:
    inputs:
      run_all:
        type: boolean
        description: Run every platform

# Cancels the run in progress when a newer one starts for the same ref. When publish.yml calls
# this workflow, github.workflow is the name of the caller, so those runs have a group of their own.
concurrency:
  group: ci.yml-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which platforms to test
  filter:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      macos: ${{ steps.filter.outputs.macos }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit, whose first parent is the base branch
          fetch-depth: 2

      - name: Filter changes
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          RUN_ALL: ${{ inputs.run_all }}
          RUN_WINDOWS: ${{ inputs.run_windows }}
          RUN_MACOS: ${{ inputs.run_macos }}
          RUN_IOS: ${{ inputs.run_ios }}
          RUN_ANDROID: ${{ inputs.run_android }}
        run: |
          # A pull request is compared with its base branch, and a push with the commit before it.
          # Other runs, such as workflow_dispatch, test only the platforms their inputs ask for.
          base=
          case $GITHUB_EVENT_NAME in
            pull_request)
              base=HEAD^1
              ;;
            push)
              # Without the commit before the push, as after a force push, every platform runs
              if git fetch --no-tags --depth=1 origin "$BEFORE"; then base=$BEFORE; else RUN_ALL=true; fi
              ;;
          esac
          if [ -n "$base" ]; then
            git diff --name-status "$base" HEAD
          fi

          # Prints whether to test a platform. $1 is its input, and the rest are the files it
          # depends on, besides the shared ones. In the patterns, * does not match / and **/
          # matches any number of folders, including none.
          shared=('**/lib/**/*.dart' '**/pubspec.yaml' '**/pubspec.lock' 'example/integration_test/**' 'example/assets/**' '.github/actions/**')
          platform() {
            local input=$1
            shift
            if [ "$RUN_ALL" = true ] || [ "$input" = true ]; then
              echo true
            elif [ -n "$base" ] && ! git diff --quiet "$base" HEAD -- "${shared[@]/#/:(glob)}" "${@/#/:(glob)}"; then
              echo true
            else
              echo false
            fi
          }
          {
            echo "windows=$(platform "$RUN_WINDOWS" '**/windows/**' '**/ci_windows.yml')"
            echo "macos=$(platform "$RUN_MACOS" 'darwin/**' 'example/macos/**' '**/ci_macos.yml')"
            echo "ios=$(platform "$RUN_IOS" 'darwin/**' 'example/ios/**' '**/ci_ios.yml')"
            echo "android=$(platform "$RUN_ANDROID" '**/android/**' '**/ci_android.yml')"
          } | tee -a "$GITHUB_OUTPUT"

  windows:
    needs: filter
    if: needs.filter.outputs.windows == 'true'
    uses: ./.github/workflows/ci_windows.yml

  macos:
    needs: filter
    if: needs.filter.outputs.macos == 'true'
    uses: ./.github/workflows/ci_macos.yml

  ios:
    needs: filter
    if: needs.filter.outputs.ios == 'true'
    uses: ./.github/workflows/ci_ios.yml

  android:
    needs: filter
    if: needs.filter.outputs.android == 'true'
    uses: ./.github/workflows/ci_android.yml

  # Unit tests and static checks are fast, so they run on every change,
  # on the latest stable Flutter and on the lowest Flutter that pubspec.yaml allows
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flutter: [stable, minimum]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Reads 3.41.0 from `flutter: '>=3.41.0'`, and fails if the line is not found
      - name: Read the minimum Flutter version
        id: minimum
        if: matrix.flutter == 'minimum'
        run: |
          version=$(grep -oP "^  flutter: '>=\K[0-9.]+" pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Without a version, the latest stable release is installed
      - name: Setup Flutter SDK
        timeout-minutes: 10
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable
          version: ${{ steps.minimum.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      # The formatting changes between versions of Dart
      - name: Format
        if: matrix.flutter == 'stable'
        run: dart format --set-exit-if-changed .

      - name: Run unit tests
        run: flutter test --coverage

      - name: Check that unit tests cover every line
        run: |
          for f in $(find lib/src -name '*.dart'); do grep -qxF "SF:$f" coverage/lcov.info || { echo "$f: not loaded by any test"; exit 1; }; done
          awk -F'[:,]' '/^SF:/{f=$2} /^DA:/ && $3==0 {print f ":" $2; bad=1} END{exit bad}' coverage/lcov.info

      - name: Test dart fix
        working-directory: test_fixes
        run: dart fix --compare-to-golden
