# Runner details on https://github.com/actions/runner-images/tree/main/images
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_all:
        type: boolean
        description: "Run all jobs regardless of path filters"
        required: false
        default: false
      run_windows:
        type: boolean
        description: "Run Windows tests"
        required: false
        default: false
      run_macos:
        type: boolean
        description: "Run macOS tests"
        required: false
        default: false
      run_ios:
        type: boolean
        description: "Run iOS tests"
        required: false
        default: false
      run_android:
        type: boolean
        description: "Run Android tests"
        required: false
        default: false
  workflow_call:
    inputs:
      run_all:
        type: boolean
        description: "Run all jobs regardless of path filters"
        required: false
        default: false
      run_windows:
        type: boolean
        description: "Run Windows tests"
        required: false
        default: false
      run_macos:
        type: boolean
        description: "Run macOS tests"
        required: false
        default: false
      run_ios:
        type: boolean
        description: "Run iOS tests"
        required: false
        default: false
      run_android:
        type: boolean
        description: "Run Android tests"
        required: false
        default: false

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      common_changed: ${{ steps.filter.outputs.common }}
      windows_changed: ${{ steps.filter.outputs.windows }}
      macos_changed: ${{ steps.filter.outputs.macos }}
      ios_changed: ${{ steps.filter.outputs.ios }}
      android_changed: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            common:
              - '**/lib/**/*.dart'
              - '**/pubspec.yaml'
              - '**/pubspec.lock'
              - 'example/integration_test/**'
              - 'example/assets/**'
            windows:
              - '**/windows/**'
              - '**/ci_windows.yml'
            macos:
              - 'darwin/**'
              - 'example/macos/**'
              - '**/ci_macos.yml'
            ios:
              - 'darwin/**'
              - 'example/ios/**'
              - '**/ci_ios.yml'
            android:
              - '**/android/**'
              - '**/ci_android.yml'

  windows:
    needs: filter
    if: ${{ needs.filter.outputs.windows_changed == 'true' || needs.filter.outputs.common_changed == 'true' || inputs.run_all || inputs.run_windows }}
    uses: ./.github/workflows/ci_windows.yml

  macos:
    needs: filter
    if: ${{ needs.filter.outputs.macos_changed == 'true' || needs.filter.outputs.common_changed == 'true' || inputs.run_all || inputs.run_macos }}
    uses: ./.github/workflows/ci_macos.yml

  ios:
    needs: filter
    if: ${{ needs.filter.outputs.ios_changed == 'true' || needs.filter.outputs.common_changed == 'true' || inputs.run_all || inputs.run_ios }}
    uses: ./.github/workflows/ci_ios.yml

  android:
    needs: filter
    if: ${{ needs.filter.outputs.android_changed == 'true' || needs.filter.outputs.common_changed == 'true' || inputs.run_all || inputs.run_android }}
    uses: ./.github/workflows/ci_android.yml

  # Unit tests are fast, so they run on every change
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run unit tests
        run: flutter test --coverage

      - name: Check that unit tests cover every line
        run: |
          awk -F: '
            /^SF:/ { file = $2 }
            /^LF:/ { found[file] = $2; total += $2 }
            /^LH:/ { hit[file] = $2; covered += $2 }
            END {
              for (f in found) if (hit[f] < found[f]) print f ": " hit[f] "/" found[f]
              printf "Coverage: %d/%d lines\n", covered, total
              exit (covered != total)
            }
          ' coverage/lcov.info

      - name: Test dart fix
        working-directory: test_fixes
        run: dart fix --compare-to-golden
