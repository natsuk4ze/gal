name: Android Integration Tests

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        # Flutter beta channel default minSdkVersion is 24 (Android 7.0)
        # Source: https://github.com/flutter/flutter/blob/beta/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt
        api-level: ['37.0', 36, 35, 34, 33, 32, 31, 30, 29, 28, 27, 26, 25, 24]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Some runners have only about 6 GB free, and the emulator needs 7.2 GB for the userdata partition
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost && df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.1

      # On API 24 and 25, a streamed adb install sometimes never finishes. The APK reaches PackageManager
      # through a pseudo-terminal, and its last bytes stay in the emulator kernel (PackageManager waits in
      # n_tty_read after adb has sent the whole APK). --no-streaming pushes the APK as a file and then runs
      # pm install, which avoids it. Wrap adb so that every install, including the ones that flutter test runs,
      # uses it, and still stops after a minute and tries again.
      - name: Install APKs without streaming
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          mv "$adb" "$adb.real"
          cat > "$adb" <<'EOF'
          #!/bin/bash
          case " $* " in
            *" install "*)
              args=()
              for a in "$@"; do args+=("$a"); [ "$a" = install ] && args+=(--no-streaming); done
              for i in 1 2 3; do
                timeout 1m "$0.real" "${args[@]}" && exit 0
                echo "adb install did not finish, trying again" >&2
              done
              exit 1 ;;
            *) exec "$0.real" "$@" ;;
          esac
          EOF
          chmod +x "$adb"

      # Retry in the same emulator. timeout stops a test run that hangs,
      # and the wait between attempts outlasts short download failures, such as HTTP 504 from GitHub
      # or a socket error from pub.dev (the flutter commands resolve the packages inside the loop).
      # API 29 and lower need the storage permissions, granted by `adb install -g` before the tests run.
      # --no-uninstall keeps them for the next attempt.
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          working-directory: ./example
          arch: x86_64
          # On the default API 29 image, the debug app sometimes crashes in malloc or never draws its first frame
          # (23 of 521 launches), with Impeller or Skia and with -gpu guest. The google_apis image did so in 1 of 418.
          target: ${{ matrix.api-level == 29 && 'google_apis' || 'default' }}
          # API 37 does not finish a cold boot within 200 seconds on 2 cores,
          # but API 24 and 25 hang right after booting with 4 cores and 4 GB
          emulator-boot-timeout: 600
          cores: ${{ matrix.api-level >= 37 && 4 || 2 }}
          ram-size: ${{ matrix.api-level >= 37 && '4096M' || '' }}
          disable-spellchecker: true
          disk-size: 4GB
          sdcard-path-or-size: ${{ matrix.api-level < 29 && '10M' || null }}
          emulator-options: -accel on -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: >-
            for i in 1 2 3; do
            [ $i -eq 1 ] || sleep 60;
            if ${{ matrix.api-level <= 29 }}; then flutter build apk --debug && adb install -r -g build/app/outputs/flutter-apk/app-debug.apk || continue; fi;
            timeout 10m flutter test --no-uninstall integration_test/integration_test.dart && exit 0;
            done; exit 1
