name: No Response

# Closes issues and pull requests that have been labeled
# "💬 waiting for response" for 20 days without any activity.
# The label is only ever added manually; any comment or update removes it.
on:
  schedule:
    - cron: '0 0 * * *'

# By specifying the access of one of the scopes, all of those that are not
# specified are set to 'none'.
permissions:
  issues: write
  pull-requests: write

jobs:
  noResponse:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'natsuk4ze/gal' }}
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: -1
          days-before-close: 20
          stale-issue-label: "💬 waiting for response"
          stale-pr-label: "💬 waiting for response"
          close-issue-message: >
            Without additional information, we are unfortunately not sure how to
            resolve this issue. We are therefore reluctantly going to close this
            bug for now.

            If you find this problem please file a new issue with the same description,
            Thanks for your contribution.
          close-pr-message: >
            This pull request has been waiting for a response for 20 days, so we
            are closing it for now.

            Feel free to reopen it or open a new one if you would like to continue.
            Thanks for your contribution.
