# Records the demo videos in the README on the latest OS of each platform.
# example/integration_test/demo_test.dart taps the example app, and each job records the screen meanwhile.
# The test prints "DEMO: start" and "DEMO: gallery", which tell the jobs when to start and stop recording.
name: Demo

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - demo-videos

jobs:
  ios:
    # The Xcode 27 image runs macOS 27, with the iOS 27 simulators
    permissions:
      contents: write
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable
          cache: true

      # The same patch as in ci_ios.yml (flutter/flutter#181771)
      - name: Patch the Flutter tool
        run: |
          cd "$FLUTTER_ROOT"
          if ! grep -q '_ready' packages/flutter_tools/lib/src/ios/simulators.dart; then
            curl -sfL https://github.com/flutter/flutter/commit/c3ed85ef987759ee54a6bce275490cde2a238dc1.diff | git apply --include='packages/flutter_tools/lib/*'
            rm -f bin/cache/flutter_tools.stamp
          fi
          flutter --version

      # Picks the newest iPhone Pro on the newest iOS runtime
      - name: Boot the simulator
        run: |
          xcrun simctl list runtimes
          device=$(xcrun simctl list --json devices available | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-[0-9]+(-[0-9]+)*$"))
              | (.key | ltrimstr("com.apple.CoreSimulator.SimRuntime.iOS-") | split("-") | map(tonumber)) as $v
              | .value[] | {udid, name, state, v: $v}]
            | (map(.v) | max) as $latest
            | map(select(.v == $latest))
            | (map(select(.name | test("^iPhone [0-9]+ Pro$")))
                | sort_by(.name | capture("(?<n>[0-9]+)").n | tonumber) | reverse)
              + map(select(.name | startswith("iPhone")))
            | first | "\(.udid) \(.state) \(.v | map(tostring) | join(".")) \(.name)"')
          read -r udid state version name <<< "$device"
          echo "Picked $name (iOS $version) [$udid] - $state"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          [ "$state" = Booted ] || xcrun simctl boot "$udid"
          perl -e 'alarm shift; exec @ARGV' 900 xcrun simctl bootstatus "$udid"
          xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      # The same as in ci_ios.yml
      - name: Grant permission
        run: |
          xcrun simctl privacy "$UDID" grant photos studio.midoridesign.galExample
          sqlite3 "$(xcrun simctl getenv "$UDID" HOME)/Library/TCC/TCC.db" \
            "UPDATE access SET auth_version = 2 WHERE service = 'kTCCServicePhotos'"

      - name: Build
        working-directory: example
        run: flutter build ios --simulator --debug --target integration_test/demo_test.dart

      # Opens Photos once, so that what it shows on its first launch is not in the demo
      - name: Warm up Photos
        run: |
          out="$RUNNER_TEMP/demo"
          mkdir -p "$out"
          xcrun simctl openurl "$UDID" photos-redirect://
          for i in 1 2 3; do sleep 4; xcrun simctl io "$UDID" screenshot "$out/warm_$i.png"; done
          xcrun simctl terminate "$UDID" com.apple.mobileslideshow || true

      # The app built from the test runs the test when it launches, without flutter test
      - name: Record the demo
        working-directory: example
        run: |
          out="$RUNNER_TEMP/demo"
          log="$out/app.log"
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          wait_for() { for i in $(seq $(($2 * 4))); do grep -q "$1" "$log" "$out/stream.log" 2> /dev/null && return 0; sleep 0.25; done; echo "::warning::No $1 in $2 seconds"; return 1; }

          limit 300 xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'eventMessage CONTAINS "DEMO:"' > "$out/stream.log" 2>&1 &
          sleep 2
          xcrun simctl launch --console-pty "$UDID" studio.midoridesign.galExample > "$log" 2>&1 &
          wait_for 'DEMO: start' 120
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$out/ios.mov" &
          recorder=$!
          wait_for 'DEMO: gallery' 60
          sleep 7
          limit 30 xcrun simctl io "$UDID" screenshot "$out/end.png" || true
          kill -INT "$recorder"
          wait "$recorder" || true
          ls -la "$out"

      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-ios
          path: ${{ runner.temp }}/demo

      # Artifacts cannot be downloaded everywhere, so the outputs also go to a branch
      - name: Push the outputs
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/demo"
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q -m "Demo of $GITHUB_SHA on ios"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/demo-output-ios

  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The same as in ci_android.yml
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost && df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.1

      # The newest stable image with Google Play, which has Google Photos, on the newest Pixel
      - name: Start the emulator
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"

          yes | sdkmanager --licenses > /dev/null
          image=$(sdkmanager --list --channel=0 2>/dev/null | grep -oE 'system-images;android-[0-9.]+;google_apis_playstore;x86_64' | sort -uV | tail -1)
          echo "Image: $image"
          sdkmanager --install emulator "$image" --channel=0 > /dev/null

          device=$(avdmanager list device | grep -oE '"pixel_[0-9]+"' | tr -d '"' | sort -uV | tail -1)
          echo "Device: $device"
          echo no | avdmanager create avd --force -n demo --package "$image" --device "$device"
          {
            echo "hw.cpu.ncore=4"
            echo "hw.ramSize=6144"
            echo "disk.dataPartition.size=8GB"
            echo "hw.keyboard=no"
          } >> "$ANDROID_AVD_HOME/demo.avd/config.ini"

          "$ANDROID_HOME/emulator/emulator" -port 5554 -avd demo -accel on -no-snapshot-save -no-window \
            -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for i in $(seq 450); do
            [ "$(adb shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ] && break
            sleep 2
          done
          # The services start a while after the boot completes. Waits until they have answered 10 times in a row.
          ready=0
          for i in $(seq 300); do
            if adb shell service check window 2> /dev/null | grep -q ': found' && adb shell pm path android > /dev/null 2>&1; then
              ready=$((ready + 1))
            else
              ready=0
            fi
            [ "$ready" -ge 10 ] && break
            sleep 2
          done
          echo "Ready after about $((i * 2)) seconds"
          echo "Android $(adb shell getprop ro.build.version.release) (API $(adb shell getprop ro.build.version.sdk))"
          adb shell wm size

      # A clean status bar, and touches shown for the tap in Google Photos
      - name: Set up the screen
        run: |
          demo() { adb shell am broadcast -a com.android.systemui.demo -e command "$@" || echo "::warning::demo $1 failed"; }
          adb shell settings put global sysui_demo_allowed 1 || echo "::warning::sysui_demo_allowed failed"
          demo enter
          demo clock -e hhmm 0941
          demo battery -e level 100 -e plugged false
          demo network -e wifi show -e level 4 -e fully true
          demo network -e mobile show -e datatype none -e level 4 -e fully true
          demo notifications -e visible false
          adb shell settings put system show_touches 1 || echo "::warning::show_touches failed"

      - name: Write the helpers
        run: |
          cat > "$RUNNER_TEMP/find_view.py" <<'EOF'
          # Prints the center of the first view whose text or description fully matches a pattern
          import re, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.stdin)
          for pattern in sys.argv[1:]:
              for node in root.iter("node"):
                  for value in (node.get("text", ""), node.get("content-desc", "")):
                      if re.fullmatch(pattern, value.strip(), re.I | re.S):
                          x1, y1, x2, y2 = map(int, re.findall(r"\d+", node.get("bounds")))
                          print((x1 + x2) // 2, (y1 + y2) // 2)
                          sys.exit()
          EOF
          cat > "$RUNNER_TEMP/helpers.sh" <<'EOF'
          shot() { adb exec-out screencap -p > "$out/$1.png"; adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1; adb exec-out cat /sdcard/ui.xml > "$out/$1.xml"; }
          find_view() { adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1; adb exec-out cat /sdcard/ui.xml | python3 "$RUNNER_TEMP/find_view.py" "$@"; }
          tap_view() { local p; p=$(find_view "$@"); echo "Tap '$*' at '$p'"; [ -n "$p" ] && adb shell input tap $p; }
          EOF

      # Opens Google Photos once as Gal.open does, and closes what it shows on its first launch
      - name: Warm up Google Photos
        run: |
          out="$RUNNER_TEMP/demo"
          mkdir -p "$out"
          . "$RUNNER_TEMP/helpers.sh"
          adb shell am start -a android.intent.action.VIEW -d content://media/external/images/media -t vnd.android.cursor.dir/image
          for i in 1 2 3 4 5 6 7 8; do
            sleep 4
            shot "warm_$i"
            tap_view 'use without an account' 'not now' 'no thanks' 'skip' 'got it' 'allow' 'always' 'close' 'dismiss' 'cancel' 'done' || true
          done
          adb shell input keyevent HOME

      - name: Build
        working-directory: example
        run: flutter build apk --debug --target integration_test/demo_test.dart

      - name: Record the demo
        working-directory: example
        run: |
          out="$RUNNER_TEMP/demo"
          log="$out/app.log"
          . "$RUNNER_TEMP/helpers.sh"
          wait_for() { for i in $(seq $(($2 * 4))); do grep -q "$1" "$log" && return 0; sleep 0.25; done; echo "::warning::No $1 in $2 seconds"; return 1; }

          adb install -r -g build/app/outputs/flutter-apk/app-debug.apk
          adb logcat -c
          adb logcat -s flutter:I > "$log" 2>&1 &
          adb shell am start -n studio.midoridesign.gal_example/.MainActivity
          wait_for 'DEMO: start' 120
          adb shell screenrecord --bit-rate 12000000 /sdcard/demo.mp4 &
          recorder=$!
          wait_for 'DEMO: gallery' 60
          sleep 3
          shot gallery
          tap_view '.*video.*' || true
          sleep 5
          shot end
          adb shell pkill -INT screenrecord || true
          wait "$recorder" || true
          sleep 2
          adb pull /sdcard/demo.mp4 "$out/android.mp4"
          ls -la "$out"

      - name: Save the logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/demo/" || true
          adb logcat -d -b crash > "$RUNNER_TEMP/demo/crash.log" 2>&1 || true
          adb logcat -d -t 3000 > "$RUNNER_TEMP/demo/logcat.log" 2>&1 || true

      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-android
          path: ${{ runner.temp }}/demo

      # Artifacts cannot be downloaded everywhere, so the outputs also go to a branch
      - name: Push the outputs
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/demo"
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q -m "Demo of $GITHUB_SHA on android"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/demo-output-android

  macos:
    permissions:
      contents: write
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable
          cache: true

      # The user has no TCC database yet, so make one with the schema of the system one.
      # TCC checks the process responsible for the app, which is the agent running the job.
      - name: Allow access to the photo library
        run: |
          sw_vers
          system_profiler SPDisplaysDataType | grep -i resolution || true
          agent=$(sudo launchctl procinfo $$ | sed -n 's/^[[:space:]]*responsible path = //p')
          echo "Agent: $agent"
          dir="$HOME/Library/Application Support/com.apple.TCC"
          if [ ! -f "$dir/TCC.db" ]; then
            mkdir -p "$dir"
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" .schema | sqlite3 "$dir/TCC.db"
            version=$(sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" 'PRAGMA user_version')
            sqlite3 "$dir/TCC.db" "PRAGMA user_version = $version"
          fi
          for service in kTCCServicePhotos kTCCServicePhotosAdd; do
            sqlite3 -cmd '.timeout 10000' "$dir/TCC.db" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('$service', '$agent', 1, 2, 3, 1)"
          done
          launchctl kickstart -k "gui/$(id -u)/com.apple.tccd" || killall tccd || true

      # A window like a phone, named Gal
      - name: Set up the window
        working-directory: example/macos/Runner
        run: |
          sed -i '' 's/<rect key="contentRect" x="335" y="390" width="800" height="600"\/>/<rect key="contentRect" x="40" y="80" width="440" height="600"\/>/' Base.lproj/MainMenu.xib
          plutil -replace CFBundleName -string Gal Info.plist
          grep -n contentRect Base.lproj/MainMenu.xib

      - name: Build
        working-directory: example
        run: flutter build macos --debug --target integration_test/demo_test.dart

      # Answers the dialogs on the first launch of Photos
      - name: Warm up Photos
        run: |
          out="$RUNNER_TEMP/demo"
          mkdir -p "$out"
          cat > "$RUNNER_TEMP/answer.applescript" <<'EOF'
          on run
            set answers to {"Allow", "Continue", "Get Started", "Not Now", "OK"}
            tell application "System Events"
              repeat with p in (every process whose visible is true)
                try
                  repeat with w in (every window of p)
                    repeat with b in (every button of w)
                      if name of b is in answers then
                        click b
                        return (name of p) & ": " & (name of b)
                      end if
                    end repeat
                  end repeat
                end try
              end repeat
            end tell
            return ""
          end run
          EOF
          open -a Photos
          for i in $(seq 8); do
            sleep 4
            screencapture -x "$out/warm_$i.png" || true
            osascript "$RUNNER_TEMP/answer.applescript" || true
          done
          osascript -e 'tell application "Photos" to quit' || true
          sleep 3

      # The app built from the test runs the test when it launches, without flutter test.
      # Started from the shell, the agent is responsible for it, and TCC allows it the photo library.
      - name: Record the demo
        working-directory: example
        run: |
          out="$RUNNER_TEMP/demo"
          log="$out/app.log"
          wait_for() { for i in $(seq $(($2 * 4))); do grep -q "$1" "$log" && return 0; sleep 0.25; done; echo "::warning::No $1 in $2 seconds"; return 1; }

          build/macos/Build/Products/Debug/example.app/Contents/MacOS/example > "$log" 2>&1 &
          app=$!
          sleep 1
          osascript -e 'tell application "System Events" to set frontmost of process "example" to true' || true
          wait_for 'DEMO: start' 120
          screencapture -v -x -V 16 "$out/macos.mov" &
          recorder=$!
          # Answers a permission dialog, in case TCC asks after all
          for i in $(seq 12); do osascript "$RUNNER_TEMP/answer.applescript" > /dev/null 2>&1 || true; grep -q 'DEMO: gallery' "$log" && break; sleep 0.5; done
          wait_for 'DEMO: gallery' 60
          sleep 6
          screencapture -x "$out/end.png" || true
          wait "$recorder" || true
          kill "$app" || true
          ls -la "$out"

      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-macos
          path: ${{ runner.temp }}/demo

      # Artifacts cannot be downloaded everywhere, so the outputs also go to a branch
      - name: Push the outputs
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/demo"
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q -m "Demo of $GITHUB_SHA on macos"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/demo-output-macos

  windows:
    # Windows Server 2025 is built on Windows 11 24H2
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable
          cache: true

      # A window like a phone, named Gal
      - name: Set up the screen
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1280 -Height 720 -Force
          choco install ffmpeg -y --no-progress | Select-Object -Last 1
          $main = 'example/windows/runner/main.cpp'
          (Get-Content $main) -replace 'size\(1280, 720\)', 'size(440, 600)' -replace 'Create\(L"example"', 'Create(L"Gal"' | Set-Content $main

      - name: Build
        working-directory: example
        run: flutter build windows --debug --target integration_test/demo_test.dart

      - name: Record the demo
        working-directory: example
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win32 {
            [DllImport("user32.dll")] public static extern IntPtr FindWindow(string className, string title);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hWnd, IntPtr after, int x, int y, int width, int height, uint flags);
          }
          "@
          $out = "$env:RUNNER_TEMP\demo"
          $log = "$out\flutter.log"
          New-Item -ItemType Directory -Force $out | Out-Null
          function Wait-For($text, $seconds) {
            for ($i = 0; $i -lt $seconds * 20; $i++) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern $text -SimpleMatch -Quiet)) { return }
              Start-Sleep -Milliseconds 50
            }
            Write-Host "::warning::No $text in $seconds seconds"
          }

          # Clears the desktop, such as the console of the runner
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 1
          $test = Start-Process cmd -ArgumentList '/c', "flutter test -d windows integration_test/demo_test.dart --dart-define=DEMO_SHOW=explorer `"--dart-define=DEMO_BUTTON=Save Image from file path`" > `"$log`" 2>&1" -PassThru -NoNewWindow
          Wait-For 'DEMO: start' 600
          $ffmpeg = Start-Process ffmpeg -ArgumentList '-hide_banner', '-loglevel', 'warning', '-y', '-f', 'gdigrab', '-framerate', '30', '-t', '14', '-i', 'desktop', '-c:v', 'libx264', '-preset', 'veryfast', '-pix_fmt', 'yuv420p', "$out\windows.mp4" -PassThru -NoNewWindow
          Wait-For 'DEMO: gallery' 60
          # Puts File Explorer next to the app as soon as it opens
          for ($i = 0; $i -lt 200; $i++) {
            $window = [Win32]::FindWindow('CabinetWClass', $null)
            if ($window -ne [IntPtr]::Zero) { [Win32]::SetWindowPos($window, [IntPtr]::Zero, 470, 10, 790, 640, 0x0040) | Out-Null; break }
            Start-Sleep -Milliseconds 20
          }
          $ffmpeg.WaitForExit()
          Get-ChildItem "$env:USERPROFILE\Pictures" | Format-Table Name, Length
          Stop-Process -Name example -ErrorAction SilentlyContinue
          Stop-Process -Id $test.Id -ErrorAction SilentlyContinue
          Get-ChildItem $out

      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-windows
          path: ${{ runner.temp }}/demo

      # Artifacts cannot be downloaded everywhere, so the outputs also go to a branch
      - name: Push the outputs
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/demo"
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q -m "Demo of $GITHUB_SHA on windows"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/demo-output-windows
