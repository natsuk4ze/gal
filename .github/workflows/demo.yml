# Records the demo videos in the README on the latest OS of each platform.
# example/integration_test/demo_test.dart taps the example app, and each job records the screen meanwhile.
# The test prints "DEMO: ready" with its temporary folder, and waits until the job has started recording and created
# demo_go there. Then it saves an image, opens the gallery and prints "DEMO: gallery", and the job stops recording later.
name: Demo

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      android-api:
        description: API level of Android. API 37 (Android 17) crashes on the emulator when the screen is captured.
        default: '36'
  push:
    branches:
      - demo-videos

jobs:
  ios:
    if: ${{ !contains(github.event.head_commit.message, '[only') || contains(github.event.head_commit.message, 'ios]') }}
    # The Xcode 27 image runs macOS 27, with the iOS 27 simulators
    permissions:
      contents: write
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable
          cache: true

      # The same patch as in ci_ios.yml (flutter/flutter#181771)
      - name: Patch the Flutter tool
        run: |
          cd "$FLUTTER_ROOT"
          if ! grep -q '_ready' packages/flutter_tools/lib/src/ios/simulators.dart; then
            curl -sfL https://github.com/flutter/flutter/commit/c3ed85ef987759ee54a6bce275490cde2a238dc1.diff | git apply --include='packages/flutter_tools/lib/*'
            rm -f bin/cache/flutter_tools.stamp
          fi
          flutter --version

      # Picks the newest iPhone Pro on the newest iOS runtime
      - name: Boot the simulator
        run: |
          xcrun simctl list runtimes
          device=$(xcrun simctl list --json devices available | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-[0-9]+(-[0-9]+)*$"))
              | (.key | ltrimstr("com.apple.CoreSimulator.SimRuntime.iOS-") | split("-") | map(tonumber)) as $v
              | .value[] | {udid, name, state, v: $v}]
            | (map(.v) | max) as $latest
            | map(select(.v == $latest))
            | (map(select(.name | test("^iPhone [0-9]+ Pro$")))
                | sort_by(.name | capture("(?<n>[0-9]+)").n | tonumber) | reverse)
              + map(select(.name | startswith("iPhone")))
            | first | "\(.udid) \(.state) \(.v | map(tostring) | join(".")) \(.name)"')
          read -r udid state version name <<< "$device"
          echo "Picked $name (iOS $version) [$udid] - $state"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          [ "$state" = Booted ] || xcrun simctl boot "$udid"
          perl -e 'alarm shift; exec @ARGV' 900 xcrun simctl bootstatus "$udid"
          xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      # The same as in ci_ios.yml
      - name: Grant permission
        run: |
          xcrun simctl privacy "$UDID" grant photos studio.midoridesign.galExample
          sqlite3 "$(xcrun simctl getenv "$UDID" HOME)/Library/TCC/TCC.db" \
            "UPDATE access SET auth_version = 2 WHERE service = 'kTCCServicePhotos'"

      - name: Build
        working-directory: example
        run: flutter build ios --simulator --debug --target integration_test/demo_test.dart

      # idb taps the simulator, to answer what Photos shows on its first launch
      - name: Install idb
        run: |
          brew tap facebook/fb > /dev/null
          brew trust facebook/fb
          brew install facebook/fb/idb-companion > /dev/null
          pip3 install --break-system-packages --quiet fb-idb
          idb list-targets | grep "$UDID"

      # simctl io recordVideo records What's New of Photos all black, so it is answered before the demo,
      # and then the request for notifications
      - name: Warm up Photos
        run: |
          out="$RUNNER_TEMP/demo"
          mkdir -p "$out"
          # Screenshots fail for a while after the boot, with "Timeout waiting for screen surfaces"
          shot() { for i in 1 2 3 4 5 6; do xcrun simctl io "$UDID" screenshot "$out/$1.png" && return 0; sleep 10; done; return 1; }
          # Taps the simulator at x and y in thousandths of its screen
          tap() { idb ui tap --udid "$UDID" $((width * $1 / 1000 / 3)) $((height * $2 / 1000 / 3)); }

          xcrun simctl openurl "$UDID" photos-redirect://
          sleep 8
          shot warm_1
          read -r width height <<< "$(sips -g pixelWidth -g pixelHeight "$out/warm_1.png" | awk '/pixel/ {printf "%s ", $2}')"
          # Continue
          tap 500 921
          sleep 4
          shot warm_2
          # Don't Allow
          tap 311 593
          sleep 2
          shot warm_3
          xcrun simctl terminate "$UDID" com.apple.mobileslideshow || true

      # The app built from the test runs the test when it launches, without flutter test
      - name: Record the demo
        working-directory: example
        run: |
          out="$RUNNER_TEMP/demo"
          log="$out/app.log"
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          wait_for() { for i in $(seq $(($2 * 4))); do grep -q "$1" "$log" "$out/stream.log" 2> /dev/null && return 0; sleep 0.25; done; echo "::warning::No $1 in $2 seconds"; return 1; }
          now() { python3 -c 'import time; print(f"{time.time():.3f}")'; }

          limit 300 xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'eventMessage CONTAINS "DEMO:"' > "$out/stream.log" 2>&1 &
          sleep 2
          xcrun simctl launch --console-pty "$UDID" studio.midoridesign.galExample > "$log" 2>&1 &
          wait_for 'DEMO: ready' 120
          temp=$(grep -ho 'DEMO: ready .*' "$log" "$out/stream.log" 2> /dev/null | head -1 | sed 's/^DEMO: ready //' | tr -d '\r')
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$out/ios.mov" 2> "$out/recorder.log" &
          recorder=$!
          for i in $(seq 40); do grep -q 'Recording started' "$out/recorder.log" && break; sleep 0.25; done
          echo "start=$(now)" > "$out/timing.txt"
          sleep 1
          touch "$temp/demo_go"
          echo "go=$(now)" >> "$out/timing.txt"
          wait_for 'DEMO: gallery' 60
          echo "gallery=$(now)" >> "$out/timing.txt"
          sleep 6
          limit 30 xcrun simctl io "$UDID" screenshot "$out/end.png" || true
          kill -INT "$recorder"
          wait "$recorder" || true
          ls -la "$out"

      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-ios
          path: ${{ runner.temp }}/demo

      # Artifacts cannot be downloaded everywhere, so the outputs also go to a branch
      - name: Push the outputs
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/demo"
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q --allow-empty -m "Demo of $GITHUB_SHA on ios"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/demo-output-ios

  android:
    if: ${{ !contains(github.event.head_commit.message, '[only') || contains(github.event.head_commit.message, 'android]') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SERIAL: emulator-5554
      API: ${{ inputs.android-api || '36' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The same as in ci_android.yml
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost && df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.1

      # The stable image with Google Play, which has Google Photos, on the newest Pixel.
      # On API 37, the graphics of the emulator abort when anything reads the screen, such as screenrecord.
      - name: Start the emulator
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"

          yes | sdkmanager --licenses > /dev/null
          image=$(sdkmanager --list --channel=0 2>/dev/null | grep -oE "system-images;android-$API(\.[0-9]+)?;google_apis_playstore;x86_64" | sort -uV | tail -1)
          echo "Image: $image"
          sdkmanager --install emulator "$image" --channel=0 > /dev/null

          device=$(avdmanager list device | grep -oE '"pixel_[0-9]+"' | tr -d '"' | sort -uV | tail -1)
          echo "Device: $device"
          echo no | avdmanager create avd --force -n demo --package "$image" --device "$device"
          {
            echo "hw.cpu.ncore=4"
            echo "hw.ramSize=6144"
            echo "disk.dataPartition.size=8GB"
            echo "hw.keyboard=no"
          } >> "$ANDROID_AVD_HOME/demo.avd/config.ini"

          "$ANDROID_HOME/emulator/emulator" -port 5554 -avd demo -accel on -no-snapshot-save -no-window \
            -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for i in $(seq 450); do
            [ "$(adb shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ] && break
            sleep 2
          done
          # The services start a while after the boot completes. Waits until they have answered 10 times in a row.
          ready=0
          for i in $(seq 300); do
            if adb shell service check window 2> /dev/null | grep -q ': found' && adb shell pm path android > /dev/null 2>&1; then
              ready=$((ready + 1))
            else
              ready=0
            fi
            [ "$ready" -ge 10 ] && break
            sleep 2
          done
          echo "Ready after about $((i * 2)) seconds"
          echo "Android $(adb shell getprop ro.build.version.release) (API $(adb shell getprop ro.build.version.sdk))"
          adb shell wm size

      # A clean status bar, and touches shown for the tap in Google Photos
      - name: Set up the screen
        run: |
          demo() { adb shell am broadcast -a com.android.systemui.demo -e command "$@" || echo "::warning::demo $1 failed"; }
          adb shell settings put global sysui_demo_allowed 1 || echo "::warning::sysui_demo_allowed failed"
          demo enter
          demo clock -e hhmm 0941
          demo battery -e level 100 -e plugged false
          demo network -e wifi show -e level 4 -e fully true
          demo network -e mobile show -e datatype none -e level 4 -e fully true
          demo notifications -e visible false
          adb shell settings put system show_touches 1 || echo "::warning::show_touches failed"

      - name: Write the helpers
        run: |
          cat > "$RUNNER_TEMP/find_view.py" <<'EOF'
          # Prints the center of the first view whose text or description fully matches a pattern
          import re, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.stdin)
          for pattern in sys.argv[1:]:
              for node in root.iter("node"):
                  for value in (node.get("text", ""), node.get("content-desc", "")):
                      if re.fullmatch(pattern, value.strip(), re.I | re.S):
                          x1, y1, x2, y2 = map(int, re.findall(r"\d+", node.get("bounds")))
                          print((x1 + x2) // 2, (y1 + y2) // 2)
                          sys.exit()
          EOF
          cat > "$RUNNER_TEMP/helpers.sh" <<'EOF'
          shot() { adb exec-out screencap -p > "$out/$1.png"; adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1; adb exec-out cat /sdcard/ui.xml > "$out/$1.xml"; }
          find_view() { adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1; adb exec-out cat /sdcard/ui.xml | python3 "$RUNNER_TEMP/find_view.py" "$@"; }
          tap_view() { local p; p=$(find_view "$@"); echo "Tap '$*' at '$p'"; [ -n "$p" ] && adb shell input tap $p; }
          EOF

      # Opens Google Photos once as Gal.open does, and closes what it shows on its first launch
      - name: Warm up Google Photos
        run: |
          out="$RUNNER_TEMP/demo"
          mkdir -p "$out"
          . "$RUNNER_TEMP/helpers.sh"
          adb shell am start -a android.intent.action.VIEW -d content://media/external/images/media -t vnd.android.cursor.dir/image
          for i in 1 2 3 4 5 6 7 8; do
            sleep 4
            shot "warm_$i"
            tap_view 'use without an account' 'not now' 'no thanks' 'skip' 'got it' 'allow' 'always' 'close' 'dismiss' 'cancel' 'done' || true
          done
          adb shell input keyevent HOME

      - name: Build
        working-directory: example
        run: flutter build apk --debug --target integration_test/demo_test.dart --dart-define=DEMO_SHOW=viewer

      - name: Record the demo
        working-directory: example
        run: |
          out="$RUNNER_TEMP/demo"
          log="$out/app.log"
          . "$RUNNER_TEMP/helpers.sh"
          wait_for() { for i in $(seq $(($2 * 4))); do grep -q "$1" "$log" && return 0; sleep 0.25; done; echo "::warning::No $1 in $2 seconds"; return 1; }
          now() { python3 -c 'import time; print(f"{time.time():.3f}")'; }

          adb install -r -g build/app/outputs/flutter-apk/app-debug.apk
          adb logcat -c
          adb logcat -s flutter:I > "$log" 2>&1 &
          adb shell am start -n studio.midoridesign.gal_example/.MainActivity
          wait_for 'DEMO: ready' 120
          temp=$(grep -o 'DEMO: ready .*' "$log" | head -1 | sed 's/^DEMO: ready //' | tr -d '\r')
          adb shell screenrecord --bit-rate 12000000 /sdcard/demo.mp4 &
          recorder=$!
          # screenrecord takes about half a second to start
          sleep 0.5
          echo "start=$(now)" > "$out/timing.txt"
          sleep 1.5
          adb shell run-as studio.midoridesign.gal_example touch "$temp/demo_go" || adb shell touch "$temp/demo_go"
          echo "go=$(now)" >> "$out/timing.txt"
          wait_for 'DEMO: gallery' 60
          echo "gallery=$(now)" >> "$out/timing.txt"
          # Opens the saved image in Google Photos, as its gallery asks to sign in on the emulator
          id=$(adb shell content query --uri content://media/external/images/media --projection _id --sort '"_id DESC"' | grep -o '_id=[0-9]*' | head -1 | cut -d= -f2)
          adb shell am start -a android.intent.action.VIEW -d "content://media/external/images/media/$id" -t image/jpeg -p com.google.android.apps.photos
          sleep 6
          shot end
          adb shell pkill -INT screenrecord || true
          wait "$recorder" || true
          sleep 2
          adb pull /sdcard/demo.mp4 "$out/android.mp4"
          ls -la "$out"

      - name: Save the logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/demo/" || true
          adb logcat -d -b crash > "$RUNNER_TEMP/demo/crash.log" 2>&1 || true
          adb logcat -d -t 3000 > "$RUNNER_TEMP/demo/logcat.log" 2>&1 || true

      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-android
          path: ${{ runner.temp }}/demo

      # Artifacts cannot be downloaded everywhere, so the outputs also go to a branch
      - name: Push the outputs
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/demo"
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q --allow-empty -m "Demo of $GITHUB_SHA on android"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/demo-output-android

  macos:
    if: ${{ !contains(github.event.head_commit.message, '[only') || contains(github.event.head_commit.message, 'macos]') }}
    permissions:
      contents: write
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable
          cache: true

      # The runner reduces transparency and has no wallpaper, which makes macOS look older than it is
      - name: Set up the screen
        run: |
          sw_vers
          defaults read com.apple.universalaccess reduceTransparency || true
          defaults write com.apple.universalaccess reduceTransparency -bool false || sudo defaults write "$HOME/Library/Preferences/com.apple.universalaccess" reduceTransparency -bool false || true
          defaults read com.apple.universalaccess reduceTransparency || true
          ls -la /System/Library/CoreServices/DefaultDesktop.heic "/System/Library/Desktop Pictures" || true
          osascript -e 'tell application "System Events" to tell every desktop to set picture to POSIX file "/System/Library/CoreServices/DefaultDesktop.heic"' || true
          killall Dock SystemUIServer ControlCenter || true
          # The same display on every image
          brew install displayplacer > /dev/null 2>&1
          screen=$(displayplacer list | awk '/Persistent screen id/ {print $4; exit}')
          displayplacer "id:$screen res:1280x960 hz:60 color_depth:7 enabled:true scaling:off origin:(0,0) degree:0" || true
          sleep 5
          mkdir -p "$RUNNER_TEMP/demo"
          screencapture -x "$RUNNER_TEMP/demo/desktop.png"

      # A window like a phone, named Gal
      - name: Set up the window
        working-directory: example/macos/Runner
        run: |
          sed -i '' 's/<rect key="contentRect" x="335" y="390" width="800" height="600"\/>/<rect key="contentRect" x="40" y="80" width="440" height="600"\/>/' Base.lproj/MainMenu.xib
          plutil -replace CFBundleName -string Gal Info.plist
          grep -n contentRect Base.lproj/MainMenu.xib

      - name: Build
        working-directory: example
        run: flutter build macos --debug --target integration_test/demo_test.dart

      # Answers the permission dialog, and the dialogs on the first launch of Photos
      - name: Warm up
        run: |
          out="$RUNNER_TEMP/demo"
          mkdir -p "$out"
          cat > "$RUNNER_TEMP/answer.applescript" <<'EOF'
          on run
            set answers to {"Allow", "Continue", "Get Started", "Not Now", "OK"}
            tell application "System Events"
              repeat with p in (every process)
                try
                  repeat with w in (every window of p)
                    repeat with b in (every button of w)
                      if name of b is in answers then
                        click b
                        return (name of p) & ": " & (name of b)
                      end if
                    end repeat
                  end repeat
                end try
              end repeat
            end tell
            return ""
          end run
          EOF
          # Asks for the permission once, so that the dialog is not in the demo
          DEMO_WARM_UP=1 example/build/macos/Build/Products/Debug/example.app/Contents/MacOS/example > "$out/warm.log" 2>&1 &
          for i in $(seq 30); do
            sleep 2
            [ "$i" = 3 ] && screencapture -x "$out/permission.png"
            osascript "$RUNNER_TEMP/answer.applescript" || true
            grep -q 'DEMO: permission' "$out/warm.log" 2> /dev/null && break
          done
          cat "$out/warm.log" || true
          pkill -x example || true
          open -a Photos
          for i in $(seq 8); do
            sleep 4
            screencapture -x "$out/warm_$i.png" || true
            osascript "$RUNNER_TEMP/answer.applescript" || true
          done
          osascript -e 'tell application "Photos" to quit' || true
          sleep 3

      # The app built from the test runs the test when it launches, without flutter test.
      # Started from the shell, the agent is responsible for it, and TCC allows it the photo library.
      - name: Record the demo
        working-directory: example
        run: |
          out="$RUNNER_TEMP/demo"
          log="$out/app.log"
          wait_for() { for i in $(seq $(($2 * 4))); do grep -q "$1" "$log" && return 0; sleep 0.25; done; echo "::warning::No $1 in $2 seconds"; return 1; }
          now() { python3 -c 'import time; print(f"{time.time():.3f}")'; }

          build/macos/Build/Products/Debug/example.app/Contents/MacOS/example > "$log" 2>&1 &
          app=$!
          sleep 1
          osascript -e 'tell application "System Events" to set frontmost of process "example" to true' || true
          wait_for 'DEMO: ready' 120
          # The app is sandboxed, so its temporary folder is in its container
          temp=$(grep -o 'DEMO: ready .*' "$log" | head -1 | sed 's/^DEMO: ready //')
          screencapture -v -x -V 14 "$out/macos.mov" &
          recorder=$!
          echo "start=$(now)" > "$out/timing.txt"
          sleep 2
          touch "$temp/demo_go"
          echo "go=$(now)" >> "$out/timing.txt"
          wait_for 'DEMO: gallery' 60
          echo "gallery=$(now)" >> "$out/timing.txt"
          sleep 6
          screencapture -x "$out/end.png" || true
          wait "$recorder" || true
          kill "$app" || true
          ls -la "$out"

      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-macos
          path: ${{ runner.temp }}/demo

      # Artifacts cannot be downloaded everywhere, so the outputs also go to a branch
      - name: Push the outputs
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/demo"
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q --allow-empty -m "Demo of $GITHUB_SHA on macos"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/demo-output-macos

  windows:
    if: ${{ !contains(github.event.head_commit.message, '[only') || contains(github.event.head_commit.message, 'windows]') }}
    # Windows Server 2025 is built on Windows 11 24H2
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable
          cache: true

      # A window like a phone, named Gal, and File Explorer showing large thumbnails
      - name: Set up the screen
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1280 -Height 720 -Force
          choco install ffmpeg -y --no-progress | Select-Object -Last 1
          $main = 'example/windows/runner/main.cpp'
          (Get-Content $main) -replace 'size\(1280, 720\)', 'size(440, 600)' -replace 'Create\(L"example"', 'Create(L"Gal"' | Set-Content $main
          # The folder types Generic and Pictures
          foreach ($type in '{5C4F28B5-F869-4E84-8E60-F11DB97C5CC7}', '{B3690E58-E961-423B-B687-386EBFD83239}') {
            $key = "HKCU:\Software\Classes\Local Settings\Software\Microsoft\Windows\Shell\Bags\AllFolders\Shell\$type"
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name LogicalViewMode -Value 3 -Type DWord
            Set-ItemProperty -Path $key -Name Mode -Value 1 -Type DWord
            Set-ItemProperty -Path $key -Name IconSize -Value 256 -Type DWord
          }
          # Thumbnails instead of icons, which Windows Server shows by default
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name IconsOnly -Value 0 -Type DWord
          Stop-Process -Name explorer -Force
          Start-Sleep -Seconds 3
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe }
          # When the shell starts, it shows a dialog about the paging file of the runner
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Dialog {
            [DllImport("user32.dll")] public static extern IntPtr FindWindow(string className, string title);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hWnd, uint message, IntPtr wParam, IntPtr lParam);
          }
          "@
          for ($i = 0; $i -lt 60; $i++) {
            $dialog = [Dialog]::FindWindow('#32770', 'System Properties')
            if ($dialog -ne [IntPtr]::Zero) { [Dialog]::PostMessage($dialog, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null; Write-Host "Closed the dialog"; break }
            Start-Sleep -Milliseconds 500
          }

      - name: Build
        working-directory: example
        run: flutter build windows --debug --target integration_test/demo_test.dart --dart-define=DEMO_SHOW=explorer

      # File Explorer opens a folder where it was last closed, and as the folder was last shown
      - name: Warm up File Explorer
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win32 {
            [DllImport("user32.dll")] public static extern IntPtr FindWindow(string className, string title);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hWnd, IntPtr after, int x, int y, int width, int height, uint flags);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hWnd, uint message, IntPtr wParam, IntPtr lParam);
          }
          "@
          $out = "$env:RUNNER_TEMP\demo"
          New-Item -ItemType Directory -Force $out | Out-Null
          $pictures = "$env:USERPROFILE\Pictures"
          # An image, so that File Explorer keeps the view of the folder, and shows how it looks
          Copy-Item example\assets\done.jpg "$pictures\warm.jpg"
          Start-Process explorer.exe $pictures
          for ($i = 0; $i -lt 100 -and [Win32]::FindWindow('CabinetWClass', $null) -eq [IntPtr]::Zero; $i++) { Start-Sleep -Milliseconds 100 }
          Start-Sleep -Seconds 2
          $window = [Win32]::FindWindow('CabinetWClass', $null)
          [Win32]::SetWindowPos($window, [IntPtr]::Zero, 470, 10, 800, 650, 0x0040) | Out-Null
          # Extra large icons
          foreach ($w in (New-Object -ComObject Shell.Application).Windows()) { Write-Host "Window: $($w.LocationURL) $($w.Document.Folder.Self.Path) $($w.Document.CurrentViewMode) $($w.Document.IconSize)" }
          $view = (New-Object -ComObject Shell.Application).Windows() | Where-Object { $_.Document.Folder.Self.Path -eq $pictures } | Select-Object -First 1
          if ($view) {
            $view.Document.CurrentViewMode = 1
            $view.Document.IconSize = 256
            Write-Host "View: $($view.Document.CurrentViewMode) $($view.Document.IconSize)"
          } else {
            Write-Host "No view; sending the shortcut"
            $keys = New-Object -ComObject WScript.Shell
            $keys.AppActivate('Pictures') | Out-Null
            Start-Sleep -Milliseconds 500
            $keys.SendKeys('^+1')
          }
          Start-Sleep -Seconds 2
          ffmpeg -hide_banner -loglevel warning -y -f gdigrab -i desktop -frames:v 1 -update 1 "$out\explorer.png"
          [Win32]::PostMessage($window, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
          Start-Sleep -Seconds 2
          Remove-Item "$pictures\warm.jpg"

      # The app built from the test runs the test when it launches, without flutter test.
      # It writes the lines for the workflow to DEMO_LOG.
      - name: Record the demo
        working-directory: example
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win32 {
            [DllImport("user32.dll")] public static extern IntPtr FindWindow(string className, string title);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hWnd, IntPtr after, int x, int y, int width, int height, uint flags);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hWnd, uint message, IntPtr wParam, IntPtr lParam);
          }
          "@
          $out = "$env:RUNNER_TEMP\demo"
          $log = "$out\app.log"
          New-Item -ItemType Directory -Force $out | Out-Null
          function Wait-For($text, $seconds) {
            for ($i = 0; $i -lt $seconds * 20; $i++) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern $text -SimpleMatch -Quiet)) { return }
              Start-Sleep -Milliseconds 50
            }
            Write-Host "::warning::No $text in $seconds seconds"
          }

          # Clears the desktop, such as the console of the runner and a dialog about the paging file
          $dialog = [Win32]::FindWindow('#32770', 'System Properties')
          if ($dialog -ne [IntPtr]::Zero) { [Win32]::PostMessage($dialog, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null }
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 1
          $env:DEMO_LOG = $log
          $app = Start-Process build\windows\x64\runner\Debug\example.exe -PassThru
          Wait-For 'DEMO: ready' 120
          $temp = ((Select-String -Path $log -Pattern 'DEMO: ready (.*)').Matches[0].Groups[1].Value).Trim()
          $ffmpeg = Start-Process ffmpeg -ArgumentList '-hide_banner', '-loglevel', 'warning', '-y', '-f', 'gdigrab', '-framerate', '30', '-t', '14', '-i', 'desktop', '-c:v', 'libx264', '-preset', 'veryfast', '-pix_fmt', 'yuv420p', "$out\windows.mp4" -PassThru -NoNewWindow
          function Now { [string]::Format([Globalization.CultureInfo]::InvariantCulture, '{0:F3}', [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() / 1000) }
          "start=$(Now)" | Set-Content "$out\timing.txt"
          Start-Sleep -Seconds 2
          New-Item -ItemType File -Force "$temp\demo_go" | Out-Null
          "go=$(Now)" | Add-Content "$out\timing.txt"
          Wait-For 'DEMO: gallery' 60
          "gallery=$(Now)" | Add-Content "$out\timing.txt"
          # Keeps File Explorer next to the app with extra large icons, in case it does not open so
          $pictures = "$env:USERPROFILE\Pictures"
          $shell = New-Object -ComObject Shell.Application
          $watch = [Diagnostics.Stopwatch]::StartNew()
          while ($watch.ElapsedMilliseconds -lt 5000) {
            $window = [Win32]::FindWindow('CabinetWClass', $null)
            if ($window -ne [IntPtr]::Zero) { [Win32]::SetWindowPos($window, [IntPtr]::Zero, 470, 10, 800, 650, 0x0040) | Out-Null }
            $view = $null
            foreach ($w in $shell.Windows()) { if ($w.Document -and $w.Document.Folder.Self.Path -eq $pictures) { $view = $w } }
            $mode = if ($view) { $view.Document.CurrentViewMode } else { 'none' }
            "$($watch.ElapsedMilliseconds) $window $mode" | Add-Content "$out\view.log"
            if ($view -and $mode -ne 1) { $view.Document.CurrentViewMode = 1; $view.Document.IconSize = 256 }
            Start-Sleep -Milliseconds 50
          }
          $ffmpeg.WaitForExit()
          Get-ChildItem "$env:USERPROFILE\Pictures" | Format-Table Name, Length
          Stop-Process -Id $app.Id -ErrorAction SilentlyContinue
          Get-ChildItem $out

      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-windows
          path: ${{ runner.temp }}/demo

      # Artifacts cannot be downloaded everywhere, so the outputs also go to a branch
      - name: Push the outputs
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/demo"
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q --allow-empty -m "Demo of $GITHUB_SHA on windows"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/demo-output-windows

  # Makes the GIFs for the README from the videos: from just before the tap until a while after the gallery opened
  gifs:
    needs: [ios, android, macos, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download the videos
        uses: actions/download-artifact@v8
        with:
          pattern: demo-*
          path: demo

      - name: Make the GIFs
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p gifs
          # platform, video, width, seconds after the gallery opened, dither
          while read -r platform video width hold dither; do
            timing="demo/demo-$platform/timing.txt"
            [ -f "demo/demo-$platform/$video" ] && [ -f "$timing" ] || { echo "::warning::No video of $platform"; continue; }
            . <(tr -d '\r' < "$timing")
            from=$(python3 -c "print(round($go - $start + 0.5, 2))")
            duration=$(python3 -c "print(round($gallery - $go - 0.5 + $hold, 2))")
            echo "$platform: $from s for $duration s"
            ffmpeg -v error -y -ss "$from" -t "$duration" -i "demo/demo-$platform/$video" -vf "fps=15,scale=$width:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=192:stats_mode=full[p];[b][p]paletteuse=dither=$dither:diff_mode=rectangle" -loop 0 "gifs/$platform.gif"
          done << 'EOF'
          ios ios.mov 400 5 sierra2_4a
          android android.mp4 400 6 sierra2_4a
          macos macos.mov 800 4.5 bayer:bayer_scale=3
          windows windows.mp4 800 3 bayer:bayer_scale=3
          EOF
          ls -la gifs

      - name: Upload the GIFs
        uses: actions/upload-artifact@v7
        with:
          name: gifs
          path: gifs
