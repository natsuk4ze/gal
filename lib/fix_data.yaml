# Data-driven fixes for `dart fix`, which migrate code to the new API.
# See: https://dart.dev/go/data-driven-fixes
#
# Test them with `dart fix --compare-to-golden` in test_fixes.

version: 1
transforms:
  - title: "Rename to 'hasPermission'"
    date: 2026-11-11
    element:
      uris: ['package:gal/gal.dart']
      method: 'hasAccess'
      inClass: 'Gal'
    changes:
      - kind: 'rename'
        newName: 'hasPermission'

  - title: "Rename to 'requestPermission'"
